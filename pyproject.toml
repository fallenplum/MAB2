[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-credit"
version = "0.1.0"
description = "Conditional edge-credit revalidation for frozen small-model communication graphs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "requests>=2.32", "torch>=2.4", "transformers>=4.51,<5", "accelerate>=0.34", "safetensors>=0.4.3", "huggingface-hub>=0.34,<1"]

[project.optional-dependencies]
coordination = ["paramiko>=3.5,<4"]

[tool.setuptools.packages.find]
where = ["src"]
